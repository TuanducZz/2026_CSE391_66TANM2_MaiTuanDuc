<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HR Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: #222;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-left span {
            font-weight: bold;
            margin-right: 20px;
        }

        .navbar-left a {
            color: #ccc;
            text-decoration: none;
            margin-right: 10px;
        }

        .navbar-right input {
            padding: 5px;
        }

        .navbar-right button {
            padding: 5px 10px;
        }

        /* ===== CONTENT ===== */
        .container {
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .add-btn {
            background: #0d6efd;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
        }

        .btn-edit {
            background: #ffc107;
            color: #000;
        }

        .btn-delete {
            background: #dc3545;
        }

        /* ===== MODAL ===== */
        .modal {
            width: 500px;
            background: #fff;
            margin: 40px auto;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: #0d6efd;
            color: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
        }

        .modal-body {
            padding: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 6px;
        }

        .modal-footer {
            text-align: right;
            padding: 10px;
        }

        .btn-save {
            background: #198754;
        }

        .btn-cancel {
            background: #6c757d;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="navbar-left">
        <span>HR Management</span>
        <a href="#">Home</a>
        <a href="#">Contact</a>
    </div>
    <div class="navbar-right">
        <input type="text" placeholder="Search...">
        <button>Search</button>
    </div>
</div>

<!-- CONTENT -->
<div class="container">
    <div class="header">
        <h2>Employee</h2>
        <button class="add-btn">+ Add</button>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Position</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Fatima Beatriz</td>
            <td>FatimaBeatriz@gmail.com</td>
            <td>0985674321</td>
            <td>Staff</td>
            <td>
                <button class="btn btn-edit">Edit</button>
                <button class="btn btn-delete">Delete</button>
            </td>
        </tr>

        <tr>
            <td>2</td>
            <td>Gabriel Hanna</td>
            <td>GabrielHanna@gmail.com</td>
            <td>0353674231</td>
            <td>Staff</td>
            <td>
                <button class="btn btn-edit">Edit</button>
                <button class="btn btn-delete">Delete</button>
            </td>
        </tr>
    </table>
</div>

<!-- MODAL -->
<div class="modal">
    <div class="modal-header">
        <span>New Employee</span>
        <span>X</span>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <label>Name</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Position</label>
            <select>
                <option>-- Select Position --</option>
                <option>Staff</option>
                <option>Manager</option>
                <option>CEO</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sex</label>
            <input type="radio" name="sex"> Male
            <input type="radio" name="sex"> Female
        </div>
    </div>

    <div class="modal-footer">
        <button class="btn btn-save">Save</button>
        <button class="btn btn-cancel">Cancel</button>
    </div>
</div>

</body>
</html>
