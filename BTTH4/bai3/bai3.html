<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2.1 - Form Đăng Ký</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        
        input[type="text"] {
            width: 300px; padding: 8px; border: 1px solid #ccc; outline: none;
        }
        
        /* Chữ báo lỗi đỏ (Mặc định ẩn đi) */
        .error-text { color: red; font-size: 13px; display: none; margin-top: 5px; }
        
        /* Viền đỏ cho ô nhập liệu bị sai */
        .input-error { border: 2px solid red !important; background-color: #ffe6e6; }
        
        #successMsg { display: none; color: green; font-weight: bold; font-size: 18px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Đăng Ký Tài Khoản</h2>
    
    <div id="successMsg">Đăng ký thành công! 🎉</div>
    
    <form id="regForm">
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="fullname">
            <span class="error-text" id="nameErr">Tên phải từ 3 ký tự và chỉ chứa chữ cái.</span>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" id="email" placeholder="ví dụ: duc@gmail.com">
            <span class="error-text" id="emailErr">Email không hợp lệ.</span>
        </div>

        <button type="submit" style="padding: 10px 20px;">Đăng ký</button>
    </form>

    <script src="bai3.js"></script>

</body>
</html>
